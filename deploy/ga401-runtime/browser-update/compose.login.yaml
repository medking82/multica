name: multica-ga401-browser
services:
  login:
    image: multica-ga401-browser:20260831-browser1
    pull_policy: never
    hostname: GA401-Browser
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../seccomp-profile.json
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 512
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:6080/vnc.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    volumes:
      - browser-profile:/home/browser
      - browser-state:/opt/browser-state
      - browser-tools:/opt/browser-tools:ro
    labels: {io.hankee.owner: multica-ga401-browser}
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
  validator:
    image: multica-ga401-browser:20260831-browser1
    pull_policy: never
    user: "1002:1002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../seccomp-profile.json
    entrypoint: [python3, /opt/runtime/browser-update/browser_watch.py]
    command: [login-validator, watch]
    network_mode: none
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    restart: unless-stopped
    volumes:
      - browser-tools:/opt/browser-tools:ro
      - cli-validation:/opt/validation-results
    labels: {io.hankee.owner: multica-ga401-browser}
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "3"}
volumes:
  browser-profile:
    external: true
    name: multica-ga401-browser_browser-profile
  browser-state:
    external: true
    name: multica-ga401-browser_browser-state
  browser-tools:
    external: true
    name: multica-ga401-runtime_browser-tools
  cli-validation:
    external: true
    name: multica-ga401-runtime_cli-validation
networks:
  default:
    external: true
    name: multica-ga401-browser_default
