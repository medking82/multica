name: Sync upstream

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

# Workflow-file updates need a dedicated credential; GITHUB_TOKEN cannot gain
# the Workflows permission through this permissions map.
permissions: {}

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'medking82/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main into fork main
        env:
          # Fine-grained PAT: only medking82/multica; Contents + Workflows write.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure UPSTREAM_SYNC_TOKEN for medking82/multica with Contents and Workflows write permissions."
            exit 1
          fi

          gh api \
            --method POST \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GH_REPOSITORY}/merge-upstream" \
            --field branch=main
